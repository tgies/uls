name: Mutants (PR)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants-pr.yml"

jobs:
  incremental-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Need history to diff against base
          persist-credentials: false
      - name: Compute diff vs base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff origin/"$BASE_REF"...HEAD | tee git.diff
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-mutants,nextest
      - name: Run cargo-mutants on diff
        continue-on-error: true
        run: cargo mutants --workspace --no-shuffle -vV --test-tool nextest --in-diff git.diff
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-incremental.out
          path: mutants.out
