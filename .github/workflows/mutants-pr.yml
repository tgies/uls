name: Mutants (PR)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants-pr.yml"

jobs:
  incremental-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Need history to diff against base
          persist-credentials: false
      - name: Compute diff vs base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff origin/"$BASE_REF"...HEAD | tee git.diff
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants,nextest
      - name: Run cargo-mutants on diff
        continue-on-error: true
        run: cargo mutants --workspace --no-shuffle -vV --test-tool nextest --in-diff git.diff
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-incremental.out
          path: mutants.out
