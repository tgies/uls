name: Mutants (Full)

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  full-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants,nextest
      - name: Run cargo-mutants full sweep
        continue-on-error: true
        run: cargo mutants --workspace -vV --test-tool nextest
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
      - name: Compute and print mutation score
        if: always()
        run: |
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("mutants.out/outcomes.json"))
              caught  = d.get("caught",  0)
              missed  = d.get("missed",  0)
              timeout = d.get("timeout", 0)
              denom = caught + missed + timeout
              if denom:
                  score = (caught + timeout) / denom * 100
                  print(f"Mutation Score: {score:.1f}% ({caught + timeout} caught / {denom} viable)")
              else:
                  print("No viable mutants found.")
          except Exception as e:
              print(f"Failed to compute score: {e}")
          EOF
